name: DISRM workspace build
on:
  pull_request:
    paths:
      - 'disrm/**'
      - 'src/BulkSms.jsx'
      - 'src/firebase.js'
      - 'src/bulk-sms.css'
      - 'sms-functions/**'
      - 'package*.json'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:disrm
